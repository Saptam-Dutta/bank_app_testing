name: Bank App Tests

# Runs the whole Python suite (database + API + browser UI) on every push and pull request.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:        # lets you press "Run workflow" manually in the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Create backend/.env for CI
        # .env is (rightly) not in git, so the pipeline writes its own. The JWT secret is random per run.
        run: |
          {
            echo "DB_HOST=127.0.0.1"
            echo "DB_USER=root"
            echo "DB_PASSWORD=ci_root_password"
            echo "DB_NAME=bank_app"
            echo "PORT=5000"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > backend/.env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        working-directory: tests
        run: pip install -r requirements.txt

      - name: Install the browser for the UI tests
        working-directory: tests
        run: python -m playwright install --with-deps chromium

      - name: Run database, API and UI tests
        working-directory: tests
        run: >
          python -m pytest
          --html=reports/full_report.html --self-contained-html
          --junitxml=reports/junit.xml

      - name: Upload test report and screenshots
        if: always()          # keep the report even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            tests/reports/full_report.html
            tests/reports/junit.xml
            tests/reports/screenshots/
            tests/reports/backend_server.log
          if-no-files-found: ignore
