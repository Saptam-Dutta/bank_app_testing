[pytest]
testpaths = .
# Load and stress tests are slow and noisy on shared machines, so a plain `pytest` skips them.
# Run them on purpose with:  python -m pytest -m performance   /   -m stress
addopts = -v --tb=short -p no:playwright -m "not performance and not stress"
markers =
    database: database-layer tests (constraints, triggers, locking)
    api: API/backend tests
    ui: browser UI tests (Playwright)
    smoke: quick build-verification checks (is the system alive and are the core flows working)
    schema: API response-shape (contract) tests
    accessibility: WCAG / keyboard / screen-reader checks
    performance: load and database-speed tests (Locust), excluded from the default run
    stress: stress, spike and recovery tests (Locust), excluded from the default run
